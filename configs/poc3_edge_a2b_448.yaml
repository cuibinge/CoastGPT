# PoC-3 A2b: Larger-context input-size ablation (448)
# Goal: test if 448×448 inputs improve coastline semantic discrimination.
# A2 at 224 achieved F1=0.039 with FP median distance 51px → context insufficient.
# A2b doubles input size → ViT grid 28×28 (vs 14×14), ConvNeXt P4=14×14 (vs 7×7).
# All other settings kept identical to A2 for controlled comparison.

experiment:
  name: poc3_a2b_448
  output_dir: outputs/poc3_edge/a2b_448
  seed: 42
  stage: P3-A2b

data:
  roots:
    - /home/ma-user/work/Stage3Data/海岸线/RS-海岸线二级/Patches
    - /home/ma-user/work/Stage3Data/海岸线/RS-海岸线一级/Patches
  manifest_path: outputs/poc3_edge/coastline_manifest.json
  image_size: 448
  val_ratio: 0.2
  val_split_seed: 42
  num_workers: 2
  line_width_train: 5    # scaled 2x from 224 (3→5)
  line_width_eval: 2     # scaled 2x from 224 (1→2)

model:
  alignment_dim: 1024

  rgb_vision:
    arch: dual
    global_encoder_name: dinov3_vitl16
    local_source: dino
    local_encoder_name: convnext_base
    local_ckpt_path: ./dinov3_convnext_base_pretrain_lvd1689m-801f2ba9.pth
    freeze_global: true
    freeze_local: true
    global_ckpt_path: ./dinov3_vitl16_pretrain_sat493m-eadcf0ff.pth
    input_size: [448, 448]
    semantic_grid_size: [28, 28]  # 448/16 = 28
    physical_prompt_dim: 4096
    patch_dropout: 0.0
    input_patchnorm: false
    tune_pooler: false
    attn_pooler:
      num_query: 144
      num_attn_heads: 16
      num_layers: 6

  vision_checkpoint: ./output/stage2/checkpoints/iter_2879_consolidated.pt

  fpn:
    in_channels: [128, 256, 512, 1024]
    out_channels: 256
    vit_in_channels: 1024

  edge_head:
    type: multi_scale
    in_channels: 256
    output_size: [448, 448]

  a0_checkpoint: null  # No warm-start — train from scratch at 448

train:
  device: npu
  epochs: 30
  batch_size: 1          # reduced for 448 memory
  lr_fpn: 2.0e-5
  lr_edge_head: 5.0e-5
  weight_decay: 1.0e-4
  max_grad_norm: 1.0
  log_interval: 20
  val_interval: 5
  save_interval: 5
  accum_steps: 4         # effective batch = 1 × 4 × 8 = 32

loss:
  type: deep_supervised
  focal_alpha: 0.75
  focal_gamma: 2.0

  soft_edge_sigma: 2.0   # scaled 2x (pixel space: same physical width)
  soft_edge_radius: 6    # scaled 2x

  fused_weight: 1.0
  side_weights: [0.5, 0.3, 0.2, 0.1]

postprocess:
  mode: threshold_sweep
  threshold_default: 0.30
  threshold_values:
    - 0.05
    - 0.10
    - 0.15
    - 0.20
    - 0.25
    - 0.30
    - 0.35
    - 0.40
    - 0.45
    - 0.50
    - 0.55
    - 0.60
    - 0.65
    - 0.70
    - 0.80
    - 0.90
  threshold_select_metric: buffered_f1_1px
  min_component_area: 8
  min_line_length_px: 10
  max_components: 5
  simplify_epsilon_px: 1.0

eval:
  max_val_batches: 0
