# A2-relabel: multi-scale deep supervision + soft target + UNIFIED GeoJSON labels
experiment:
  name: a2_relabel_unified
  output_dir: outputs/poc3_edge/a2_relabel_unified
  seed: 42

data:
  roots:
    - /home/ma-user/work/Stage3Data/海岸线/RS-海岸线二级/Patches
    - /home/ma-user/work/Stage3Data/海岸线/RS-海岸线一级/Patches
  manifest_path: outputs/poc3_edge/coastline_manifest.json
  image_size: 224
  val_ratio: 0.2
  num_workers: 2
  line_width_train: 1
  line_width_eval: 1

model:
  rgb_vision:
    arch: dual
    global_encoder_name: dinov3_vitl16
    local_source: dino
    local_encoder_name: convnext_base
    local_ckpt_path: ./dinov3_convnext_base_pretrain_lvd1689m-801f2ba9.pth
    freeze_global: true
    freeze_local: true
    global_ckpt_path: ./dinov3_vitl16_pretrain_sat493m-eadcf0ff.pth
    input_size: [224, 224]
    physical_prompt_dim: 4096
    patch_dropout: 0.0
    input_patchnorm: false
    tune_pooler: false
    attn_pooler:
      num_query: 144
      num_attn_heads: 16
      num_layers: 6

  vision_checkpoint: ./output/stage2/checkpoints/iter_2879_consolidated.pt

  fpn:
    in_channels: [128, 256, 512, 1024]
    out_channels: 256
    vit_in_channels: 1024

  edge_head:
    type: multi_scale
    in_channels: 256
    output_size: [224, 224]

  a0_checkpoint: null

train:
  device: npu
  epochs: 20
  batch_size: 2
  lr_fpn: 2.0e-5
  lr_edge_head: 5.0e-5
  weight_decay: 1.0e-4
  max_grad_norm: 1.0
  log_interval: 20
  val_interval: 5
  save_interval: 5
  accum_steps: 1

loss:
  type: deep_supervised
  focal_alpha: 0.75
  focal_gamma: 2.0
  soft_edge_sigma: 0.0
  soft_edge_radius: 0
  fused_weight: 1.0
  side_weights: [0.5, 0.3, 0.2, 0.1]

postprocess:
  mode: threshold_sweep
  threshold_values: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
  threshold_select_metric: buffered_f1_1px

eval:
  max_val_batches: 0
