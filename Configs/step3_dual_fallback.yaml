# Control
alignment_dim: 1024
adjust_norm: False
generate: False
prompt_template: "llava_llama_2"
stage: 3
weight_sample: True
geojson_priority: true

# Stage-3 GeoJSON quality knobs.
# - geojson_prompt_variants: number of near-duplicate prompts emitted per
#   sample at runtime when conv_data is auto-built. Default 1 (was 3+1).
# - geojson_max_answer_tokens: drop training samples whose tokenised answer
#   would exceed this many tokens; 0 disables the safety filter.
# - repair_mojibake: detect and repair UTF-8-as-GBK property strings (DLMC etc.).
geojson_prompt_variants: 1
geojson_max_answer_tokens: 0
repair_mojibake: true

# Tune Parameter
tune_im_start: False
tune_im_patch: False
tune_rgb_bk: False
tune_rgb_pooler: True

# Generic MoE routing
moe_proj:
  num_experts: 4
  top_k: 2
  condition_dim: 256
  aux_balance_coef: 0.5
  aux_entropy_coef: 0.01
  aux_zloss_coef: 0.001

rgb_vision:
  arch: dual
  global_encoder_name: dinov3_vitl16
  local_source: dino
  local_encoder_name: convnext_base
  local_ckpt_path: './dinov3_convnext_base_pretrain_lvd1689m-801f2ba9.pth'
  freeze_global: True
  freeze_local: True
  global_ckpt_path: './dinov3_vitl16_pretrain_sat493m-eadcf0ff.pth'
  default_input_size: [224, 224]
  physical_prompt_dim: 4096
  patch_dropout: 0.
  input_patchnorm: False
  tune_pooler: True
  attn_pooler:
    num_query: 144
    num_attn_heads: 16
    num_layers: 6

text:
  vocab_size: 32000
  hidden_size: 4096
  intermediate_size: 11008
  num_hidden_layers: 32
  num_attention_heads: 32
  hidden_act: "silu"
  max_position_embeddings: 4096
  initializer_range: 0.02
  rms_norm_eps: 1e-5
  use_cache: True
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  tie_word_embeddings: False
  path: meta-llama/Llama-2-7b-chat-hf

sar_vision:
  arch: base
  input_size: [192, 192]
  n_queries: 256
  in_chans: 2
  decoder:
    layers: 12
    heads: 12
    mask_ratio: 0.6
    mask_color: mean
    hidden_size: 768
  loss_weight: 1.0
  reduction: none
  activate: sigmoid
  alpha: 0.2
  focal_gamma: 1.0
  residual: False
  unmask_weight: 0.0
  online_temp: 0.1
  branch_temp: 0.07
  warmup_branch_temp: 0.04
  warmup_branch_temp_epochs: 2
ckpt_period: 5000
eval_interval: 5000

transform:
  default_input_size: [224, 224]
  rand_aug: rand-m5-n2-mstd0.5-inc1

physical_prompt_max_len: 64

eval:
  dataset: AID

# training config
# Lowered from 0.1 -> 0.02 because aux loss (raw ~8) dominated text loss (~0.77)
# at previous weight (0.1 * 8 = 0.8 vs text 0.77) and prevented text learning.
mm_moe_aux_weight: 0.2
vector_objective:
  enabled: true
  loss_weight: 0.05
  structure_weight: 2.0
  coordinate_weight: 1.5
dtype: bfloat16
bits: 8
double_quant: True
quant_type: nf4
fp16: False
bf16: True
lora:
  enable: True
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_bias: none
tune_multimodal: True

# optimizer
optimizer: adamw
lr: 0.0002
wd: 0.
epochs: 2
ckpt_period: 5000
eval_interval: 5000
max_grad_norm: 1.0
betas: [0.9, 0.95]

# scheduler
# NOTE: warmup_epochs/decay_epochs are in EPOCH units; must be <= epochs.
# Old config had warmup_epochs=100, which pinned lr at min_lr for all 8 epochs.
schedule:
  name: cosine
  min_lr: 0.00002
  warmup_epochs: 1
  warmup_method: linear
  warmup_factor: 0.1
  decay_epochs: 7
  decay_rate: 0.1
  multisteps: []
  gamma: 0.1

